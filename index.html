<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Network Design: The Gradient Puzzle</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>
  <style>
    body {
      font-family: Arial;
      background: #0f1220;
      color: white;
      text-align: center;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }
    canvas {
      border: 2px solid #555;
      image-rendering: pixelated;
      width: 256px;
      height: 256px;
    }
    .panel {
      background: #1a1f3a;
      padding: 20px;
      border-radius: 10px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      background: black;
      color: #00ff88;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      text-align: left;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Neural Network Design: The Gradient Puzzle</h1>

  <div>
    <button id="trainBtn">Train 1 Step</button>
    <button id="autoBtn">Auto Train (Start)</button>
    <button id="resetBtn">Reset Weights</button>

    <label>
      <input type="radio" name="arch" value="compression" checked />
      Compression
    </label>
    <label>
      <input type="radio" name="arch" value="transformation" />
      Transformation
    </label>
    <label>
      <input type="radio" name="arch" value="expansion" />
      Expansion
    </label>
  </div>

  <div class="container">
    <div class="panel">
      <h3>Input (Noise)</h3>
      <canvas id="inputCanvas"></canvas>
    </div>

    <div class="panel">
      <h3>Student Output</h3>
      <canvas id="outputCanvas"></canvas>
    </div>
  </div>

  <div id="log"></div>

  <script src="app.js"></script>
</body>
</html>
