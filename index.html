<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Network Design: The Gradient Puzzle</title>

  <!-- Стабильная версия TFJS -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1220;
      color: #ffffff;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .controls {
      margin: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      border: none;
    }

    #trainBtn { background: #4da3ff; }
    #autoBtn { background: #4dff88; }
    #resetBtn { background: #ff5c5c; }

    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }

    .panel {
      background: #1a1f3a;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }

    canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      border: 2px solid #555;
    }

    #log {
      margin: 20px auto;
      width: 70%;
      height: 160px;
      background: black;
      color: #00ff88;
      font-family: monospace;
      overflow-y: auto;
      padding: 10px;
      text-align: left;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Neural Network Design: The Gradient Puzzle</h1>

  <div class="controls">
    <button id="trainBtn">Train 1 Step</button>
    <button id="autoBtn">Auto Train (Start)</button>
    <button id="resetBtn">Reset Weights</button>

    <label>
      <input type="radio" name="arch" value="compression" checked>
      Compression
    </label>

    <label>
      <input type="radio" name="arch" value="transformation">
      Transformation
    </label>

    <label>
      <input type="radio" name="arch" value="expansion">
      Expansion
    </label>
  </div>

  <div class="container">
    <div class="panel">
      <h3>Input (Noise)</h3>
      <canvas id="canvas-input" width="16" height="16"></canvas>
    </div>

    <div class="panel">
      <h3>Student Output (Sorted MSE + Smooth + Direction)</h3>
      <canvas id="canvas-student" width="16" height="16"></canvas>
    </div>
  </div>

  <div id="log"></div>

  <!-- ВАЖНО: app.js в конце -->
  <script src="app.js"></script>
</body>
</html>
